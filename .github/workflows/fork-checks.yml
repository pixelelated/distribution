# The fork's record checks, run on every push of next and once a day: the
# work-log index current, the decision register sound, no friction entry
# left without an issue, the retro / weekly / monthly cadence kept, every
# recent blindspot naming a guard, an audit and a futro when they are owed.
# Red until each overdue ceremony has its artifact (#254, D-WORKFLOW-028).
# Every check step runs whether or not an earlier one failed (`if: always()`),
# so a red day shows every verdict; the job still fails when any step does
# (D-WORKFLOW-202, #944).
# Fork-only (`fork-*`): never part of an upstream PR.
name: fork record checks

on:
  push:
    branches: [next]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      ceremony_today:
        description: "Run the ceremony check as of this date (yyyy-mm-dd) -- the guard's constructed positive: a far date makes an audit or a futro overdue and the run red (audit #258 PL-020)"
        required: false
        default: ""

permissions:
  contents: read
  issues: read

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: identify upstream history for the fork issue-coverage check
        run: git fetch --no-tags https://github.com/ROCKNIX/distribution.git next:refs/remotes/upstream/next
      - name: work-log index is current
        if: always()
        run: ./tools/work-log-index --check
      - name: decision register is a lookup table
        if: always()
        run: ./tools/register-check
      - name: the instruction files are what their index says
        if: always()
        run: ./tools/rules-check
      - name: builds always enter the shared watcher and retain lifecycle evidence
        if: always()
        run: |
          python3 docs/qa-logs/2026-10-03-watch-job/test-watch-job.py tools/watch-job
          python3 tools/host-maintenance/test-build-monitor
          python3 tools/host-maintenance/test-build-admission
          python3 docs/qa-logs/2026-10-04-watch-progress/test-progress.py .
          python3 docs/qa-logs/2026-10-04-watch-progress/test-watch-build.py
          python3 docs/qa-logs/2026-10-05-watch-submit/test-submit.py
      - name: VM launch failures cannot report a guest as running
        if: always()
        run: |
          ./tools/vm-pair-test
          ./tools/vm-upgrade-readiness-test
      - name: optional hardware readings are valid or explicitly unavailable
        if: always()
        run: ./tools/rocknix-info-test
      - name: every open acceptance checkbox is agent-verifiable (D-QA-044)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/box-check --quiet
      - name: ceremonies are not overdue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CEREMONY_TODAY: ${{ inputs.ceremony_today }}
        run: ./tools/ceremony-check
